name: Release

# A tag v<version> builds hubcli (with the web app inside) and hubtui for Linux and macOS
# and publishes them as a GitHub Release that install.sh downloads:
#   hubness-<version>-<target>.tar.gz (+ .sha256), SHA256SUMS and VERSION.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: Web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hubness/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 runners: the binaries need glibc 2.35, not the newest one
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p hubcli -p hubtui --features hubcli/embed-web
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="hubness-$version-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/hubcli" "target/${{ matrix.target }}/release/hubtui" README.md LICENSE "$name/"
          "$name/hubcli" --version
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: hubness-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and version
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          echo "${GITHUB_REF_NAME#v}" > VERSION
          ls -l
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "hubness ${GITHUB_REF_NAME#v}" --generate-notes $flags
