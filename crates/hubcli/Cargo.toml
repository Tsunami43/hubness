[package]
name = "hubcli"
description = "The hubness hub: server, the agents' MCP server, git credential helper and TUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Compile the built web app (apps/web/dist, `pnpm build`) into the binary. Off by default so
# `cargo build`/`cargo test` work without a web build; install.sh turns it on.
embed-web = ["hubness-server/embed-web"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
hubness-server = { version = "0.1.0", path = "../server" }
hubness-tui = { version = "0.1.0", path = "../tui" }
tokio = { version = "1.54.1", features = ["full"] }
