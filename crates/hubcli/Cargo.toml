[package]
name = "hubcli"
description = "The hubness hub: server, the agents' MCP server, git credential helper and TUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Compile the built web app (apps/web/dist, `pnpm build`) into the binary. Off by default so
# `cargo build`/`cargo test` work without a web build; install.sh turns it on.
embed-web = ["hubness-server/embed-web"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
hubness-server.workspace = true
hubness-tui.workspace = true
tokio = { workspace = true, features = ["full"] }
