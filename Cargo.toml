[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.7"
edition = "2024"
license = "MIT"
publish = false
# The oldest toolchain the workspace builds with (its own code and the dependencies'
# rust-version, notify 9 needs 1.91); checked with `cargo +1.91 check --locked --all-targets`.
rust-version = "1.91"

# Every dependency is declared once here, pinned to the exact version in use (`=x.y.z`);
# the crates reference it with `.workspace = true` and add their own features. Cargo.lock
# is committed and builds/installs use --locked.
[workspace.dependencies]
# workspace crates
hubness-client = { version = "=0.4.7", path = "crates/client" }
hubness-core = { version = "=0.4.7", path = "crates/core" }
hubness-server = { version = "=0.4.7", path = "crates/server" }
hubness-tui = { version = "=0.4.7", path = "crates/tui" }

# shared
anyhow = "=1.0.105"
clap = { version = "=4.6.10", features = ["derive", "env"] }
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = "=1.54.1"

# hubness binary: `hubness update` unpacks release archives
flate2 = "=1.1.11"
tar = { version = "=0.4.46", default-features = false }

# server
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
axum = "=0.8.9"
base64 = "=0.23.1"
dotenvy = "=0.15.7"
http-body-util = "=0.1.5"
hyper = { version = "=1.13.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
jiff = "=1.0.3"
libc = "=0.2.191"
mime_guess = "=2.0.5"
notify = "=9.0.0"
percent-encoding = "=2.3.2"
regex = "=1.13.2"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde_norway = "=0.9.42"
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.1"
tokio-stream = { version = "=0.1.19", features = ["sync"] }
toml_edit = "=0.25.21"
tower-http = { version = "=0.7.1", features = ["fs"] }
uuid = { version = "=1.29.3", features = ["v4"] }
# server tests
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

# terminal UI: ratatui, crossterm, edtui and tui-term have to agree on the ratatui and
# crossterm versions, and vt100 on the one tui-term draws (tui-term 0.3.4 uses vt100 0.16)
crossterm = { version = "=0.29.0", features = ["event-stream"] }
edtui = "=0.11.9"
pulldown-cmark = "=0.13.6"
ratatui = "=0.30.2"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
tui-term = "=0.3.4"
vt100 = "=0.16.2"

# password hashing is far too slow unoptimized (sign-in in debug builds and tests)
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
